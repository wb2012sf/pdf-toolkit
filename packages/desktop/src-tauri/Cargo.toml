[package]
name = "pdf-toolkit"
version = "0.1.0"
description = "Page level PDF manipulation"
authors = ["wb2012sf"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The desktop binary is a thin wrapper around this, which is also what the
# mobile targets would link against if they are ever added.
name = "pdf_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The engine runs in the webview; Rust only provides the native save dialog
# and the file write that a page cannot do for itself.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
# A local tool, so favour a small binary over the last few percent of speed.
opt-level = "s"
lto = true
strip = true
