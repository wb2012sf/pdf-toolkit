name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against an unchanged dependency still surfaces.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Anything whose behaviour can differ by platform. --in-place renames a
  # file onto its own path, and Windows treats that differently from POSIX,
  # so it is worth proving there before the Tauri work depends on it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Read the pinned version rather than hardcoding it here, so the
          # two cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The suite runs against core's TypeScript sources through a vitest
      # alias, so it never exercises the compiled binary. Check it starts.
      - name: Smoke test the built CLI
        run: node packages/cli/dist/index.js --help

  # Lint and audit read the same files on every platform, so running them
  # once is enough.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Biome does not read YAML, and a workflow that fails to parse cannot
      # report its own failure: it simply never runs. A conditional
      # permissions block once left the desktop build unrunnable and nothing
      # noticed until it was dispatched by hand.
      #
      # Pinned tarball rather than a third party action, so this stays a
      # download of a known version rather than something that can change
      # under the job.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      - name: Audit
        run: npm run audit
