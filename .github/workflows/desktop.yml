name: Desktop build

# Not on every push: a Rust build takes minutes and Windows runner minutes
# bill at several times the Linux rate, which is a lot to pay for a docs
# commit. Run it by hand while developing, and on a version tag to publish.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Needed by the publish step, which only runs on a tag. This cannot be
    # made conditional: the permissions key is read before any expression
    # context exists, so an ${{ }} here makes the whole workflow unparseable.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The runner image ships a Rust toolchain, so there is nothing to
      # install, but the crates and the compiled output are worth keeping.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version

      # The tag is the source of truth for the version, so fail early rather
      # than publishing a v0.2.0 release containing a 0.1.0 installer.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          echo "tag $tagged, tauri.conf.json $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared"
            exit 1
          fi

      # The cargo cache restores the whole target directory, which is the
      # point: compiled dependencies are what make a rebuild fast. It also
      # restores previously bundled installers though, and nothing removes
      # those when the product name or version changes, so the directory ends
      # up holding output from more than one build.
      - name: Clear stale bundles
        shell: bash
        run: rm -rf packages/desktop/src-tauri/target/release/bundle

      # Code signing is optional and off unless credentials exist. With no
      # WINDOWS_SIGN_COMMAND secret this does nothing and the build is exactly
      # as before, unsigned.
      #
      # The overlay is written here rather than committed, so nothing in the
      # repository can break an unsigned build, and so no certificate detail
      # is ever in git. Tauri runs the command once per binary before
      # bundling, replacing %1 with the file path, which is what gets the
      # executable inside the installer signed and not just the installer.
      #
      # The command itself depends on the provider: Azure Trusted Signing,
      # SSL.com eSigner and DigiCert KeyLocker each ship their own CLI. Put
      # the whole invocation in the secret, and anything it needs, such as
      # AZURE_CLIENT_ID, in the repository's other secrets.
      - name: Prepare signing
        id: signing
        shell: bash
        env:
          SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_COMMAND:-}" ]; then
            echo "no signing credentials configured, the build will be unsigned"
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # node rather than a heredoc, so the command is JSON escaped
          # properly whatever quoting the provider's CLI needs.
          SIGN_COMMAND="$SIGN_COMMAND" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              bundle: { windows: { signCommand: process.env.SIGN_COMMAND } },
            }, null, 2));
          ' packages/desktop/src-tauri/tauri.signing.conf.json
          echo "signing enabled"
          # Relative to packages/desktop, because that is where npm -w runs
          # the script and where the tauri CLI resolves the path from. A
          # repository-root path would not be found.
          echo "config=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_OUTPUT"

      # Runs the frontend build first, per beforeBuildCommand in tauri.conf.
      - name: Build the app
        run: npm run tauri:build -w @pdf-toolkit/desktop -- ${{ steps.signing.outputs.config }}

      # Only meaningful when signing ran. An unsigned binary reaching a
      # release is worse than a failed build, because nothing about the
      # installer looks wrong until a user is warned about it.
      - name: Check the installers are signed
        if: steps.signing.outputs.config != ''
        shell: pwsh
        run: |
          $bundle = "packages/desktop/src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path $bundle -Recurse -Include *.msi,*-setup.exe
          if (-not $files) { throw "no installers found to verify" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              throw "$($file.Name) is not validly signed: $($sig.Status)"
            }
          }

      # Kept for manual runs, where there is no release to attach them to.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: pdf-toolkit-windows
          path: |
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      # On a tag, publish instead: a permanent download link that needs no
      # sign in and no gh CLI on the other end, unlike an artifact.
      #
      # Uses the gh CLI, which the runner image already has, rather than a
      # third party release action. One less thing to trust in a workflow
      # that has write access to the repository.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=packages/desktop/src-tauri/target/release/bundle

          # Arrays rather than command substitution. Capturing a glob into a
          # string joins multiple matches with a newline and then passes the
          # whole thing as one filename, which is how a leftover installer
          # produced a path containing a newline instead of a clear error.
          msi=("$bundle"/msi/*.msi)
          exe=("$bundle"/nsis/*-setup.exe)
          if [ ${#msi[@]} -ne 1 ] || [ ${#exe[@]} -ne 1 ]; then
            echo "::error::expected exactly one installer of each kind, found ${#msi[@]} msi and ${#exe[@]} exe"
            printf '  %s\n' "${msi[@]}" "${exe[@]}"
            exit 1
          fi
          echo "attaching:"
          ls -la "${msi[0]}" "${exe[0]}"
          # Draft, so the release can be read over before anyone can download
          # it. Publishing is one click in the web UI.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "PDF Toolkit $GITHUB_REF_NAME" \
            "${msi[0]}" "${exe[0]}"
